name: arquitectura-basada-mensajes-rabbitmq
services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    hostname: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  orders-api:
    build: .
    command: ["node", "api.mjs"]
    environment:
      AMQP_URL: amqp://admin:admin@rabbitmq:5672
      SERVICE_NAME: orders-api
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/health')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  notification-worker:
    deploy:
      replicas: 2
    build: .
    command: ["node", "worker.mjs"]
    environment:
      AMQP_URL: amqp://admin:admin@rabbitmq:5672
      SERVICE_NAME: notification-worker
      PROCESSING_DELAY_MS: "3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
volumes:
  rabbitmq-data:
